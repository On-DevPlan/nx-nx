<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{name}} 控制台</title>
    <meta name="description" content="{{description}}" />
    <!-- 内联 SVG 图标：不引二进制资产，也不额外发一次请求。
         好处是浏览器不会再隐式去要 /favicon.ico 然后拿一个 404
         （那条 404 会出现在每个生成项目的控制台里，很扎眼）。
         注意 data URI 里的 # 必须写成 %23，否则会被当成片段标识截断。 -->
    <link
      rel="icon"
      href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23171717'/><text x='16' y='22.5' font-family='sans-serif' font-size='17' font-weight='700' fill='%23ffffff' text-anchor='middle'>{{initial}}</text></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
