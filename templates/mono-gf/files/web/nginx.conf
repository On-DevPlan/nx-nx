# =============================================================================
# {{name}} 前端站点（nginx 底座）
#
# 职责：① 托管 SPA 静态产物 ② 把 /api 反向代理到 Go 后端容器。
#
# 关键约定 —— 反代路径规则必须与 web/vite.config.ts 的开发期代理**完全一致**：
# 后端路由本身没有 /api 前缀（GoFrame 的 api 契约就是 /hello、/user/list），
# 前端统一按 /api/xxx 调用，由这一层把 /api 剥掉。
# 两边不一致就会出现「本地好、上线 404」这种最难查的问题。
#
# 上游主机名 api 是后端服务在共享 docker 网络里的名字（见 docker-compose.yml）。
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 构建产物带内容 hash，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 必须每次回源校验：否则发版后用户拿到的还是旧页面，
    # 而旧页面引用的 hash 资源已被清理 → 白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback：未命中的路径交给前端（本模板只有两页，但留着不会错）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 接口反代 ──────────────────────────────────────────────────────────
    # proxy_pass 结尾的 "/" 是必需的：它会把 location 匹配到的 /api/ 前缀替换掉。
    # 少了这个斜杠，后端会收到 /api/user/list → 404。
    location /api/ {
        proxy_pass http://api:{{apiPort}}/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 16m;
    }

    # 后端健康检查（不经过 /api 前缀）
    location = /healthz {
        proxy_pass http://api:{{apiPort}}/hello;
        proxy_set_header Host $host;
        access_log off;
    }
}
